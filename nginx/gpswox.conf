# ----------------------------------------------------
# Nginx Reverse Proxy Configuration for GPSWOX Platform
# Place in: /etc/nginx/sites-available/gpswox.conf
# ----------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name demo.yourdomain.com; # ضع دومينك أو عنوان IP الخاص بالسيرفر هنا

    # Gzip Compression for high-speed delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 50M;

    # 1. Main Web Application, APIs, and WebSockets
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket support headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for persistent WebSocket connection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Static Asset Caching
    location /assets/ {
        proxy_pass http://127.0.0.1:3001/assets/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
